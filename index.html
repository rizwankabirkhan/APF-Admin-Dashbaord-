<!DOCTYPE html>
<html>
<head>
<title>APF Portal</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<script>window.__resources = {"https://unpkg.com/react@18.3.1/umd/react.production.min.js": "vendor/react.production.min.js", "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js": "vendor/react-dom.production.min.js", "https://unpkg.com/@babel/standalone@7.29.0/babel.min.js": "vendor/babel.min.js", "./APF%20New%20Login.dc.html": "pages/apf-new-login.html?v=3", "./Final%20Add%20Store.dc.html": "pages/final-add-store.html?v=3", "./Final%20Dashboard.dc.html": "pages/final-dashboard.html?v=3", "./Final%20Messages.dc.html": "pages/final-messages.html?v=3", "./Final%20Presets.dc.html": "pages/final-presets.html?v=3", "./Final%20Products.dc.html": "pages/final-products.html?v=3", "./Final%20Requests.dc.html": "pages/final-requests.html?v=3", "./Final%20Store%20Detail.dc.html": "pages/final-store-detail.html?v=3", "./Final%20Stores.dc.html": "pages/final-stores.html?v=3", "./Final%20Training%20Videos.dc.html": "pages/final-training-videos.html?v=3", "./Final%20Uploads.dc.html": "pages/final-uploads.html?v=3", "./Final%20Users.dc.html": "pages/final-users.html?v=3"};</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="support.js?v=3"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;background:#0b0a12}
a{color:#a78bfa}a:hover{color:#c4b5fd}
html[data-gate="1"],html[data-gate="1"] body{overflow:hidden}
[data-pl]{position:fixed;inset:0;z-index:200;overflow-y:auto;background:#0b0a12;transition:opacity .6s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.2,.8,.2,1),filter .6s ease;will-change:opacity,transform}
[data-pl][data-out="1"]{opacity:0;transform:scale(1.04);filter:blur(6px);pointer-events:none}
[data-pd]{position:relative;transition:opacity .7s cubic-bezier(.2,.8,.2,1) .15s}
[data-pd][data-in="0"]{opacity:0;pointer-events:none}
[data-pd][data-in="1"],[data-pd][data-in="2"]{opacity:1}
[data-pd][data-in="2"]{transition:none}
@media (prefers-reduced-motion:reduce){[data-pl],[data-pd]{transition:opacity .2s linear!important;transform:none!important;filter:none!important}}
</style>
</helmet>
<div data-screen-label="APF Portal" style="min-height:100vh;background:#0b0a12">
  <div data-pd="1" data-in="{{ dashIn }}">
    <sc-if value="{{ mountDash }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Final Dashboard" start-on="stores" hint-size="100%,100vh"></dc-import>
    </sc-if>
  </div>
  <sc-if value="{{ showLogin }}" hint-placeholder-val="{{ true }}">
    <div data-pl="1" data-out="{{ loginOut }}">
      <dc-import name="APF New Login" on-authed="{{ onAuthed }}" hint-size="100%,100vh"></dc-import>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { phase: "login", mount: false };
  componentDidMount() { document.documentElement.setAttribute("data-gate", "1"); window.scrollTo(0, 0); }
  componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); document.documentElement.removeAttribute("data-gate"); }
  reveal() {
    if (this.state.phase !== "login") return;
    window.scrollTo(0, 0);
    this.setState({ phase: "reveal" });
    this.t1 = setTimeout(() => {
      document.documentElement.removeAttribute("data-gate");
      this.setState({ phase: "app" });
    }, 950);
  }
  renderVals() {
    const p = this.state.phase;
    return {
      mountDash: this.state.mount || p !== "login",
      showLogin: p !== "app",
      loginOut: p === "login" ? "0" : "1",
      dashIn: p === "login" ? "0" : p === "reveal" ? "1" : "2",
      onAuthed: step => { if (step === "start" && !this.state.mount) this.setState({ mount: true }); if (step === "reveal") this.reveal(); }
    };
  }
}
</script>
</body>
</html>
