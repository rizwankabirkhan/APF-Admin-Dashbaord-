<script type="text/x-dc" data-dc-script="">
class Component extends DCLogic {
  state = { phase: "login" };
  componentDidMount() { document.documentElement.setAttribute("data-gate", "1"); window.scrollTo(0, 0); }
  componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); document.documentElement.removeAttribute("data-gate"); }
  reveal() {
    if (this.state.phase !== "login") return;
    window.scrollTo(0, 0);
    this.setState({ phase: "reveal" });
    this.t1 = setTimeout(() => {
      document.documentElement.removeAttribute("data-gate");
      this.setState({ phase: "app" });
    }, 1150);
  }
  renderVals() {
    const p = this.state.phase;
    return {
      showLogin: p !== "app",
      loginOut: p === "login" ? "0" : "1",
      dashIn: p === "login" ? "0" : p === "reveal" ? "1" : "2",
      onAuthed: step => { if (step === "reveal") this.reveal(); }
    };
  }
}
</script>
